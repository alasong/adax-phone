id: example_workflow
name: 示例开发工作流（展示所有功能）
description: 演示任务编排系统的变量替换、输出验证、结构化提示等功能
version: '1.0'
author: Super Coder
max_parallel: 3
variables:
  feature_name: PowerCalculator
  target_file: example.py
  author_name: '${env.USER}'
  created_at: '${now}'
tasks:
- id: design
  name: 设计功能规格
  description: 分析需求，创建设计文档
  tool: script
  instruction: "print('design completed')"
  parallel: true
  output_validation:
    regex: design
- id: lint_check
  name: 代码风格检查
  description: 运行代码质量检查（并行任务）
  tool: script
  instruction: "print('lint passed')"
  parallel: true
- id: implement
  name: 实现功能
  description: 根据设计实现功能
  tool: script
  instruction: "import json; print('implement done'); result = {'success': True, 'message': 'PowerCalculator implemented'}; print(json.dumps(result))"
  depends_on:
  - design
  - lint_check
  output_validation:
    json_schema:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
      required:
      - success
      - message
    assertions:
    - value.get('success')
  max_retries: 2
  chain_of_thought: true
